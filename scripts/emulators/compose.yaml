# DynamoDB Local for the integration tests (docs/decisions/0009-emulator-choice.md).
# `make emulators-up` starts it; tests reach it at http://127.0.0.1:8000.
name: dynaflux-emulators

services:
  dynamodb:
    # A version bump reruns the fidelity tests of internal/store/dynamo.
    image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
    # Telemetry is on by default. Either the flag or the variable turns it off; set both.
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-disableTelemetry"]
    environment:
      DDB_LOCAL_TELEMETRY: "0"
    ports:
      - "127.0.0.1:8000:8000"
