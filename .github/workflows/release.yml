# Builds the CLI's archives for a pushed tag and leaves a draft release for the maintainer to
# publish (docs/runbooks/release.md). Without it, a tag is still a complete release for go
# tool and go install.
name: Release

# Only a tag push starts it, so every attestation it signs names a release tag, which the
# documented check pins. A failed release is rerun with gh run rerun, which keeps the tag.
on:
  push:
    # A semantic version, such as v1.0.0 or v1.0.0-rc.1.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# Two runs for one tag would replace the same draft's files at once.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the draft release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          # main's history, for the check below.
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main."
            exit 1
          fi
      # GoReleaser keeps a published release published and replaces its files, which users
      # may have downloaded already. gh says "release not found" before the first run.
      - name: Check that the release isn't published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"; then
            if [[ "$draft" != true ]]; then
              echo "::error::$TAG is already published: a rerun would replace its files."
              exit 1
            fi
          elif [[ "$draft" != "release not found" ]]; then
            echo "::error::$draft"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The toolchain that go.mod names, so the maintainer can build the same bytes again.
      - name: Pin the Go toolchain
        run: |
          toolchain="$(go mod edit -json | jq -r '.Toolchain // ""')"
          if [[ -z "$toolchain" ]]; then
            echo "::error::go.mod has no toolchain line."
            exit 1
          fi
          echo "GOTOOLCHAIN=$toolchain" >>"$GITHUB_ENV"
      # CI's vuln check runs the newest Go patch release; the archives carry this toolchain's
      # standard library.
      - name: Check the pinned toolchain and the dependencies for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/dynaflux
      # Outside the checkout: a new file in it would make Go stamp the binaries +dirty.
      - name: Release notes
        run: scripts/release-notes.sh "$TAG" >"$RUNNER_TEMP/notes.md"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This tag, even when another one points at the same commit.
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      # Go stamps the version from the tags on the commit, and a pseudo-version for a tag it
      # ignores, such as v2 or later on this module path.
      - name: Check the version that the CLI reports
        run: |
          tar -xzOf "dist/dynaflux_${TAG#v}_linux_amd64.tar.gz" dynaflux >"$RUNNER_TEMP/dynaflux"
          chmod +x "$RUNNER_TEMP/dynaflux"
          version="$("$RUNNER_TEMP/dynaflux" version)"
          if ! grep -qx "cli             $TAG" <<<"$version"; then
            echo "$version"
            echo "::error::the CLI in the archives doesn't report $TAG."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  # Apart from the build, so that GoReleaser and syft, fetched at run time, never hold the
  # token that signs the provenance.
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the signing certificate of the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: checksums.txt
